# PersonaCore's MQTT broker.
#
# WHERE THIS FILE GOES: copy it to  <PERSONACORE_MOSQUITTO_DIR>/config/mosquitto.conf
# on the Docker host — the same path you set for PERSONACORE_MOSQUITTO_DIR in
# .env, with /config/mosquitto.conf on the end.
#
# It has to be copied rather than shipped in the image because compose.yaml
# mounts that host directory over the broker's own config directory, which
# hides the default file the eclipse-mosquitto image ships with.

listener 1883

# Anonymous connections are allowed because the broker is not published outside
# the Compose network — see the `expose` block in compose.yaml, and the comment
# there explaining why it is deliberately not in `ports`. If you ever publish
# this broker, set `allow_anonymous false`, add a password file, and point
# `bus.password_secret` in core.toml at the matching secret.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

# Log to stdout so `docker logs personacore-mosquitto` shows something useful.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
